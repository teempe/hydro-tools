[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgw-hydro-tools"
version = "0.1.0"
description = "Tools for parsing, cleaning and validating IMGW hydrological data"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tomasz Piotrowski" }
]
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]